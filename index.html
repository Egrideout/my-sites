<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111827" />
    <title>Eric&rsquo;s Web Apps</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">Deployed websites</p>
        <h1>Eric&rsquo;s Web Apps</h1>
      </div>
      <button class="icon-button" id="themeToggle" type="button" aria-label="Toggle theme" title="Toggle theme">
        <svg aria-hidden="true" viewBox="0 0 24 24">
          <path d="M12 2v2.5M12 19.5V22M4.93 4.93 6.7 6.7M17.3 17.3l1.77 1.77M2 12h2.5M19.5 12H22M4.93 19.07 6.7 17.3M17.3 6.7l1.77-1.77" />
          <circle cx="12" cy="12" r="4" />
        </svg>
      </button>
    </header>

    <main>
      <section class="hero" aria-label="Dashboard summary">
        <div class="hero-art" aria-hidden="true">
        </div>
        <div class="hero-copy">
          <p id="dateLine"></p>
          <h2>Published work, one tap away.</h2>
          <div class="hero-stats" aria-label="Site summary">
            <span><strong id="siteCount">5</strong> live sites</span>
            <span id="platformSummary">GitHub, Vercel, Firebase</span>
          </div>
        </div>
      </section>

      <section class="controls" aria-label="Site controls">
        <label class="search">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="7"></circle>
            <path d="m16 16 5 5"></path>
          </svg>
          <input id="searchInput" type="search" placeholder="Search sites" autocomplete="off" />
        </label>
        <button class="primary-button" id="addLinkButton" type="button">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M12 5v14M5 12h14"></path>
          </svg>
          Add
        </button>
      </section>

      <nav class="tabs" id="categoryTabs" aria-label="Categories"></nav>

      <section class="grid" id="linkGrid" aria-live="polite"></section>

    </main>

    <dialog id="linkDialog">
      <form method="dialog" id="linkForm">
        <div class="dialog-head">
          <h2 id="dialogTitle">Add Link</h2>
          <button class="icon-button" value="cancel" type="submit" aria-label="Close" title="Close">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M6 6l12 12M18 6 6 18"></path>
            </svg>
          </button>
        </div>
        <input type="hidden" id="linkId" />
        <label>
          Name
          <input id="nameInput" required maxlength="48" />
        </label>
        <label>
          URL
          <input id="urlInput" required inputmode="url" placeholder="https://example.com" />
        </label>
        <label>
          Category
          <input id="categoryInput" required maxlength="28" placeholder="Projects" />
        </label>
        <label>
          Note
          <textarea id="noteInput" maxlength="120" rows="3" placeholder="What this is for"></textarea>
        </label>
        <div class="dialog-actions">
          <button id="deleteButton" class="danger-button" value="delete" type="button">Delete</button>
          <button class="primary-button" value="save" type="submit">Save</button>
        </div>
      </form>
    </dialog>

    <template id="linkCardTemplate">
      <article class="link-card">
        <a class="card-main" target="_blank" rel="noreferrer">
          <span class="site-mark" aria-hidden="true"></span>
          <span class="card-copy">
            <span class="card-kicker"></span>
            <strong></strong>
            <small></small>
            <span class="domain"></span>
          </span>
        </a>
        <div class="card-actions">
          <span class="open-glyph" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M7 17 17 7"></path>
              <path d="M8 7h9v9"></path>
            </svg>
          </span>
          <button class="icon-button edit-button" type="button" aria-label="Edit link" title="Edit link">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M12 20h9"></path>
              <path d="m16.5 3.5 4 4L8 20l-5 1 1-5Z"></path>
            </svg>
          </button>
        </div>
      </article>
    </template>

    <script src="app.js?v=20260516-wardrobe"></script>
  </body>
</html>
